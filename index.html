    <script>
      // Patch Node.prototype.removeChild & insertBefore so Google Translate DOM mutations never crash React Virtual DOM
      (function () {
        if (typeof Node === 'function' && Node.prototype) {
          var originalRemoveChild = Node.prototype.removeChild;
          Node.prototype.removeChild = function (child) {
            if (child && child.parentNode !== this) {
              return child;
            }
            return originalRemoveChild.apply(this, arguments);
          };

          var originalInsertBefore = Node.prototype.insertBefore;
          Node.prototype.insertBefore = function (newNode, referenceNode) {
            if (referenceNode && referenceNode.parentNode !== this) {
              return newNode;
            }
            return originalInsertBefore.apply(this, arguments);
          };
        }

        window.googleTranslateElementInit = function () {
          try {
            if (window.google && window.google.translate && window.google.translate.TranslateElement) {
              var targetId = document.getElementById('google_translate_element')
                ? 'google_translate_element'
                : 'google_translate_fallback';
              var container = document.getElementById(targetId);
              if (container && container.childElementCount === 0) {
                new window.google.translate.TranslateElement(
                  {
                    pageLanguage: 'auto',
                    includedLanguages: 'id,en,zh-CN,ja,ko,ar,ms,es',
                    autoDisplay: false,
                  },
                  targetId
                );
              }
            }
          } catch (e) {}
        };
      })();
    </script>
    <style>
      iframe.goog-te-banner-frame,

      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        width: 0 !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
      html, body {
        top: 0px !important;
        position: static !important;
        margin-top: 0px !important;
      }
    </style>

  <body>

    <div id="google_translate_fallback" style="display:none;"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
